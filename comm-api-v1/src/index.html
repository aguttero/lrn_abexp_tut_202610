<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Get started with Add-on development using JavaScript with Document Sandbox Runtime"
    />
    <meta
      name="keywords"
      content="Adobe, Express, Add-On, JavaScript, Document Sandbox Runtime"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get Started</title>
    <style>
      .container {
        margin: 24px;
        display: flex;
        flex-direction: column;
      }

      button {
        background-color: rgb(82, 88, 228);
        border-color: rgb(82, 88, 228);
        border-radius: 16px;
        border-style: solid;
        color: rgb(255, 255, 255);
        font-family: sans-serif;
        height: 32px;
      }

      button:disabled {
        background-color: rgb(177, 177, 177);
        border-color: rgb(177, 177, 177);
      }

      button:not([disabled]):hover {
        background-color: rgb(64, 70, 202);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <sp-theme scale="medium" color="light" system="express">
      <h3>Framework status</h3>
      <hr />
      <div class="row">
        <sp-status-light size="m" variant="negative" id="iframe-status">
          iFrame API
        </sp-status-light>
        <sp-status-light size="m" variant="negative" id="document-status">
          Authoring API
        </sp-status-light>
      </div>
      <h3>Document statistics</h3>
      <hr />
      <div class="row">
        <sp-table size="m">
          <sp-table-head>
            <sp-table-head-cell>Element</sp-table-head-cell>
            <sp-table-head-cell>Count</sp-table-head-cell>
          </sp-table-head>
          <sp-table-body id="stats-table-body">
            <sp-table-row id="row-placeholder">
              <sp-table-cell>Get the Document stats first...</sp-table-cell>
            </sp-table-row>
          </sp-table-body>
        </sp-table>
      </div>
      <div class="row align-right">
        <sp-button id="stats">Analyze document</sp-button>
      </div>
    </sp-theme>
  </body>
</html>
